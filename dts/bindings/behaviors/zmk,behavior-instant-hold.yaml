description: |
  Hold key that is pressed the moment the binding goes down. A release inside
  tapping-term-ms releases the hold key and then taps the second parameter.
  A longer press leaves the hold key down until release.

  The first parameter is the hold keycode and the second is the tap keycode.
  Both are forwarded to the behaviors in `bindings`, which are key-press
  behaviors without their own parameters.

compatible: "zmk,behavior-instant-hold"

include: two_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  tapping-term-ms:
    type: int
    required: true
