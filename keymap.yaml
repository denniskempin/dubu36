# Dubu36 keymap — firmware-independent source of truth (keymap-drawer YAML).
# See: https://github.com/caksoylar/keymap-drawer/blob/main/KEYMAP_SPEC.md
#
# Hold `type` values (diagram styling only; ignored by firmware codegen):
#   tap-preferred  — outline box (mod-tap, ZMK mt_ tap-preferred)
#   hold-preferred — solid box  (layer-tap, ZMK lt_ balanced)
#   sticky         — large solid box (sticky tap-hold)
#
# Edit this file, then:
#   make keymaps   # regenerate ZMK/QMK
#   make diagrams  # regenerate SVG diagrams

layout:
  ortho_layout:
    split: true
    rows: 3
    columns: 5
    thumbs: 3

layers:
  Default:
    - [Q, W, F, P, G, J, L, U, Y, "*"]
    - - {t: A, h: Hyper, type: hold-preferred}
      - {t: R, h: Shift, type: tap-preferred}
      - {t: S, h: Alt, type: tap-preferred}
      - {t: T, h: Cmd, type: tap-preferred}
      - {t: D, h: Ctrl, type: tap-preferred}
      - {t: H, h: Ctrl, type: tap-preferred}
      - {t: N, h: Cmd, type: tap-preferred}
      - {t: E, h: Alt, type: tap-preferred}
      - {t: I, h: Shift, type: tap-preferred}
      - {t: O, h: Hyper, type: hold-preferred}
    - - {t: Z, h: Adjust, type: hold-preferred}
      - X
      - C
      - V
      - B
      - K
      - M
      - ","
      - .
      - {t: "'", h: Adjust, type: hold-preferred}
    - - {t: Esc, h: Mouse, type: hold-preferred}
      - {t: "", h: Shift, type: tap-preferred}
      - {t: Tab, h: Lower, type: hold-preferred}
      - Ret
      - {t: Spc, h: Raise, type: hold-preferred}
      - {t: Bksp, h: Hyper, type: hold-preferred}

  Raise:
    - ["", "7", "8", "9", "", Home, WordL, Up, WordR, End]
    - - {t: "", h: Hyper, type: hold-preferred}
      - {t: "4", h: Shift, type: tap-preferred}
      - {t: "5", h: Alt, type: tap-preferred}
      - {t: "6", h: Cmd, type: tap-preferred}
      - {t: "", h: Ctrl, type: tap-preferred}
      - {t: Fwd, h: Ctrl, type: tap-preferred}
      - {t: Left, h: Cmd, type: tap-preferred}
      - {t: Down, h: Alt, type: tap-preferred}
      - {t: Right, h: Shift, type: tap-preferred}
      - {t: Bck, h: Hyper, type: hold-preferred}
    - ["0", "1", "2", "3", "", TabL, "Hyp_[", "Hyp_\\", "Hyp_]", TabR]
    - ["", "", "", "", "", ""]

  Lower:
    - ["~", "^", "@", "$", "%", "&", "/", "\\", "|", "`"]
    - - {t: Uml, h: Hyper, type: hold-preferred}
      - {t: "<", h: Shift, type: tap-preferred}
      - {t: "[", h: Alt, type: tap-preferred}
      - {t: "(", h: Cmd, type: tap-preferred}
      - {t: "{", h: Ctrl, type: tap-preferred}
      - {t: "-", h: Ctrl, type: tap-preferred}
      - {t: "_", h: Cmd, type: tap-preferred}
      - {t: ":", h: Alt, type: tap-preferred}
      - {t: ";", h: Shift, type: tap-preferred}
      - {t: "#", h: Hyper, type: hold-preferred}
    - ["", ">", "]", ")", "}", "+", "=", "?", "!", '"']
    - ["", "", "", "", "", AltBksp]

  Hyper:
    - [Hyp_Q, Hyp_W, Hyp_F, Hyp_P, Hyp_G, Hyp_1, Hyp_2, Hyp_3, Hyp_4, Hyp_5]
    - [Hyp_A, Hyp_R, Hyp_S, Hyp_T, Hyp_D, "", Hyp_Left, Hyp_Up, Hyp_Right, ""]
    - [Hyp_Z, Hyp_X, Hyp_C, Hyp_V, Hyp_B, "", "Hyp_;", Hyp_Down, "Hyp_'", ""]
    - [Hyp_Esc, "", Hyp_Tab, Hyp_Ret, Hyp_Spc, Hyp_Bksp]

  Adjust:
    - [Bt0, Bt1, Bt2, "", "", "", "", "", "", ""]
    - [BtClr, "", "", "", "", "", "", "", "", ""]
    - ["", "", "", "", "", "", "", "", "", ""]
    - ["", "", "", "", "", ""]

  Mouse:
    - [Cmd_Q, Cmd_W, "", "", "", "", "", "", "", ""]
    - ["", "", Cmd_S, Cmd_T, "", "", "", "", "", ""]
    - [Cmd_Z, Cmd_X, Cmd_C, Cmd_V, "", "", "", "", "", ""]
    - ["", "", "", "", "", ""]

combos: []

draw_config:
  dark_mode: true
  n_columns: 1
  footer_text: Dubu36
  style_layer_activators: true
  key_rx: 8
  key_ry: 8
  shrink_wide_legends: 5
  # Catppuccin-mocha-like reference card styling
  svg_extra_style: |
    svg.keymap {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background-color: #1e1e2e;
    }
    rect.key {
      fill: #313244;
      stroke: #45475a;
      stroke-width: 1.25;
    }
    rect.key.trans {
      fill: #1e1e2e;
      stroke: #313244;
      stroke-dasharray: 3 3;
    }
    text.tap { fill: #cdd6f4; font-size: 15px; font-weight: 600; }
    text.hold { fill: #a6adc8; font-size: 10px; }
    text.tl { fill: #cdd6f4; font-size: 12px; font-weight: 600; }
    text.tr, use.tr { fill: #cba6f7; font-size: 11px; }
    text.br, use.br, text.bl, use.bl { fill: #fab387; font-size: 11px; }
    text.layer-activator { text-decoration: none; fill: #89b4fa; font-size: 10px; font-weight: 600; }

    /* Tap/hold preference boxes (drawn behind center legend) */
    rect.mod-box {
      rx: 3;
      ry: 3;
      stroke-width: 1.35;
    }
    /* Empty outline = tap-preferred */
    rect.mod-box.tap-preferred {
      fill: none;
      stroke: #cdd6f4;
    }
    text.tap.tap-preferred {
      fill: #cdd6f4;
      font-size: 10px;
      font-weight: 600;
    }
    /* Solid fill = hold-preferred */
    rect.mod-box.hold-preferred {
      fill: #a6adc8;
      stroke: #a6adc8;
    }
    text.tap.hold-preferred {
      fill: #1e1e2e;
      font-size: 10px;
      font-weight: 700;
    }
    /* Larger solid = sticky tap-hold */
    rect.mod-box.sticky {
      fill: #cdd6f4;
      stroke: #cdd6f4;
      stroke-width: 1.5;
    }
    text.tap.sticky {
      fill: #1e1e2e;
      font-size: 11px;
      font-weight: 700;
    }

    /* Thumb layer activator fills */
    rect.key.thumb-raise { fill: #3f2e1e; stroke: #fab387; }
    rect.key.thumb-lower { fill: #1e2a3f; stroke: #89b4fa; }
    rect.key.thumb-hyper { fill: #3f1e2a; stroke: #f38ba8; }
    rect.key.thumb-mouse { fill: #1e3f28; stroke: #a6e3a1; }
    rect.key.thumb-adjust { fill: #2a1e3f; stroke: #cba6f7; }
