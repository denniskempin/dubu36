# Dubu36 keymap — firmware-independent source of truth.
#
# Hold `type` values (diagram styling; ignored by firmware codegen):
#   tap-preferred  — outline box, bottom-left quadrant (ZMK mt_ tap-preferred)
#   hold-preferred — solid box, bottom-left quadrant (ZMK lt_ balanced)
#   sticky         — solid bar covering the full left half of the key
#
# Stacked reference card legend positions:
#   top-left      Default (base)
#   bottom-left   hold binding
#   top-right     Lower (symbols)
#   bottom-right  Raise (numbers / nav)
#
# Edit this file, then:
#   make keymaps   # regenerate ZMK/QMK
#   make diagrams  # regenerate SVG diagrams

layout:
  ortho_layout:
    split: true
    rows: 3
    columns: 5
    thumbs: 3

layers:
  Default:
    - [Q, W, F, P, G, J, L, U, Y, "*"]
    - - {t: A, h: Hyper, type: hold-preferred}
      - {t: R, h: Shift, type: tap-preferred}
      - {t: S, h: Alt, type: tap-preferred}
      - {t: T, h: Cmd, type: tap-preferred}
      - {t: D, h: Ctrl, type: tap-preferred}
      - {t: H, h: Ctrl, type: tap-preferred}
      - {t: N, h: Cmd, type: tap-preferred}
      - {t: E, h: Alt, type: tap-preferred}
      - {t: I, h: Shift, type: tap-preferred}
      - {t: O, h: Hyper, type: hold-preferred}
    - - {t: Z, h: Adjust, type: hold-preferred}
      - X
      - C
      - V
      - B
      - K
      - M
      - ","
      - .
      - {t: "'", h: Adjust, type: hold-preferred}
    - - {t: Esc, h: Mouse, type: hold-preferred}
      - {t: "", h: Shift, type: sticky}
      - {t: Tab, h: Lower, type: hold-preferred}
      - Ret
      - {t: Spc, h: Raise, type: hold-preferred}
      - {t: Bksp, h: Hyper, type: hold-preferred}

  Raise:
    - ["", "7", "8", "9", "", Home, WordL, Up, WordR, End]
    - - {t: "", h: Hyper, type: hold-preferred}
      - {t: "4", h: Shift, type: tap-preferred}
      - {t: "5", h: Alt, type: tap-preferred}
      - {t: "6", h: Cmd, type: tap-preferred}
      - {t: "", h: Ctrl, type: tap-preferred}
      - {t: Fwd, h: Ctrl, type: tap-preferred}
      - {t: Left, h: Cmd, type: tap-preferred}
      - {t: Down, h: Alt, type: tap-preferred}
      - {t: Right, h: Shift, type: tap-preferred}
      - {t: Bck, h: Hyper, type: hold-preferred}
    - ["0", "1", "2", "3", "", TabL, "Hyp_[", "Hyp_\\", "Hyp_]", TabR]
    - ["", "", "", "", "", ""]

  Lower:
    - ["~", "^", "@", "$", "%", "&", "/", "\\", "|", "`"]
    - - {t: Uml, h: Hyper, type: hold-preferred}
      - {t: "<", h: Shift, type: tap-preferred}
      - {t: "[", h: Alt, type: tap-preferred}
      - {t: "(", h: Cmd, type: tap-preferred}
      - {t: "{", h: Ctrl, type: tap-preferred}
      - {t: "-", h: Ctrl, type: tap-preferred}
      - {t: "_", h: Cmd, type: tap-preferred}
      - {t: ":", h: Alt, type: tap-preferred}
      - {t: ";", h: Shift, type: tap-preferred}
      - {t: "#", h: Hyper, type: hold-preferred}
    - ["", ">", "]", ")", "}", "+", "=", "?", "!", '"']
    - ["", "", "", "", "", AltBksp]

  Hyper:
    - [Hyp_Q, Hyp_W, Hyp_F, Hyp_P, Hyp_G, Hyp_1, Hyp_2, Hyp_3, Hyp_4, Hyp_5]
    - [Hyp_A, Hyp_R, Hyp_S, Hyp_T, Hyp_D, "", Hyp_Left, Hyp_Up, Hyp_Right, ""]
    - [Hyp_Z, Hyp_X, Hyp_C, Hyp_V, Hyp_B, "", "Hyp_;", Hyp_Down, "Hyp_'", ""]
    - [Hyp_Esc, "", Hyp_Tab, Hyp_Ret, Hyp_Spc, Hyp_Bksp]

  Adjust:
    - [Bt0, Bt1, Bt2, "", "", "", "", "", "", ""]
    - [BtClr, "", "", "", "", "", "", "", "", ""]
    - ["", "", "", "", "", "", "", "", "", ""]
    - ["", "", "", "", "", ""]

  Mouse:
    - [Cmd_Q, Cmd_W, "", "", "", "", "", "", "", ""]
    - ["", "", Cmd_S, Cmd_T, "", "", "", "", "", ""]
    - [Cmd_Z, Cmd_X, Cmd_C, Cmd_V, "", "", "", "", "", ""]
    - ["", "", "", "", "", ""]

combos: []
