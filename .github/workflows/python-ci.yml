name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Without this, a branch with an open PR runs the workflow twice per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: keymap_generator
        # diagrams group: ty cannot resolve cairosvg without it.
        run: uv sync --locked --group diagrams

      - name: Ruff check
        working-directory: keymap_generator
        run: uv run ruff check src tests

      - name: Ruff format
        working-directory: keymap_generator
        run: uv run ruff format --check src tests

      - name: Type check
        working-directory: keymap_generator
        run: uv run ty check

      - name: Tests
        working-directory: keymap_generator
        run: uv run pytest
