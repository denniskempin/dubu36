name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: keymap_generator
        run: uv sync --locked

      - name: Ruff check
        working-directory: keymap_generator
        run: uv run ruff check src tests

      - name: Ruff format
        working-directory: keymap_generator
        run: uv run ruff format --check src tests

      - name: Type check
        working-directory: keymap_generator
        run: uv run ty check

      - name: Tests
        working-directory: keymap_generator
        run: uv run pytest
