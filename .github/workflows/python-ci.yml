name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch with an open PR would otherwise get a push run and a pull_request run
# of every workflow for each commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: keymap_generator
        # The diagrams group is needed for `ty` to resolve the cairosvg import
        # in render.py, not just for rendering PNGs.
        run: uv sync --locked --group diagrams

      - name: Ruff check
        working-directory: keymap_generator
        run: uv run ruff check src tests

      - name: Ruff format
        working-directory: keymap_generator
        run: uv run ruff format --check src tests

      - name: Type check
        working-directory: keymap_generator
        run: uv run ty check

      - name: Tests
        working-directory: keymap_generator
        run: uv run pytest
