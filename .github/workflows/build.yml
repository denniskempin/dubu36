on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Without this, a branch with an open PR runs the workflow twice per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
