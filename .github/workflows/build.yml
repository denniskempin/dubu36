on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch with an open PR would otherwise get a push run and a pull_request run
# of every workflow for each commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
