# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# Board targets carry Zephyr's HWMv2 qualifiers since ZMK moved to Zephyr 4.1:
# nice_nano@1.0.0//zmk is the nice!nano v1 with ZMK's board variant, and
# xiao_ble//zmk replaces seeeduino_xiao_ble. artifact-name is set on every entry
# because the default derives from the board target, which would otherwise put
# the qualifiers into every firmware file name.
---
include:
  - board: nice_nano@1.0.0//zmk
    shield: corne_left
    artifact-name: corne_left-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: corne_right
    artifact-name: corne_right-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: dubu36e_left
    artifact-name: dubu36e_left-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: dubu36e_right
    artifact-name: dubu36e_right-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    artifact-name: corne_dongle-xiao_ble-zmk
  - board: nice_nano@1.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano-zmk
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset-xiao_ble-zmk
