# Board targets carry Zephyr HWMv2 qualifiers. artifact-name is set on every
# entry because the default is derived from the board target and would put
# those qualifiers into every firmware file name.
---
include:
  - board: nice_nano@1.0.0//zmk
    shield: corne_left
    artifact-name: corne_left-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: corne_right
    artifact-name: corne_right-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: dubu36e_left
    artifact-name: dubu36e_left-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: dubu36e_right
    artifact-name: dubu36e_right-nice_nano-zmk
  - board: nice_nano@1.0.0//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  # One firmware per Prospector status screen: the Kconfig choice is compile-time.
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y
    artifact-name: corne_dongle_classic-xiao_ble-zmk
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
    artifact-name: corne_dongle_radii-xiao_ble-zmk
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
    artifact-name: corne_dongle_field-xiao_ble-zmk
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
    artifact-name: corne_dongle_operator-xiao_ble-zmk
  - board: nice_nano@1.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano-zmk
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset-xiao_ble-zmk
