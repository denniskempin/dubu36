<svg width="690" height="336" viewBox="0 0 690 336" class="keymap" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>/* inherit to force styles through use tags */
svg path {
    fill: inherit;
}

/* font and background color specifications */
svg.keymap {
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    font-size: 14px;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
    fill: #24292e;
}

/* default key styling */
rect.key {
    fill: #f6f8fa;
}

rect.key, rect.combo {
    stroke: #c9cccf;
    stroke-width: 1;
}

/* default key side styling, only used is draw_key_sides is set */
rect.side {
    filter: brightness(90%);
}

/* color accent for combo boxes */
rect.combo, rect.combo-separate {
    fill: #cdf;
}

/* color accent for held keys */
rect.held, rect.combo.held {
    fill: #fdd;
}

/* color accent for ghost (optional) keys */
rect.ghost, rect.combo.ghost {
    stroke-dasharray: 4, 4;
    stroke-width: 2;
}

text {
    text-anchor: middle;
    dominant-baseline: middle;
}

/* styling for layer labels */
text.label {
    font-weight: bold;
    text-anchor: start;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for optional footer */
text.footer {
    text-anchor: end;
    dominant-baseline: auto;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for combo tap, and key non-tap label text */
text.combo, text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br {
    font-size: 11px;
}

text.hold, text.bl, text.br {
    text-anchor: middle;
    dominant-baseline: auto;
}

text.shifted, text.tl, text.tr {
    text-anchor: middle;
    dominant-baseline: hanging;
}

text.left, text.tl, text.bl {
    text-anchor: start;
}

text.right, text.tr, text.br {
    text-anchor: end;
}

text.layer-activator {
    text-decoration: underline;
}

/* styling for hold/shifted label text in combo box */
text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
    font-size: 8px;
}

/* lighter symbol for transparent keys */
text.trans {
    fill: #7b7e81;
}

/* styling for combo dendrons */
path.combo {
    stroke-width: 1;
    stroke: gray;
    fill: none;
}

/* Start Tabler Icons Cleanup */
/* cannot use height/width with glyphs */
.icon-tabler > path {
    fill: inherit;
    stroke: inherit;
    stroke-width: 2;
}
/* hide tabler's default box */
.icon-tabler > path[stroke="none"][fill="none"] {
    visibility: hidden;
}
/* End Tabler Icons Cleanup */

svg.keymap { fill: #d1d6db; }
rect.key { fill: #3f4750; }
rect.key, rect.combo { stroke: #60666c; }
rect.combo, rect.combo-separate { fill: #1f3d7a; }
rect.held, rect.combo.held { fill: #854747; }
text.label, text.footer { stroke: black; }
text.trans { fill: #7e8184; }
path.combo { stroke: #7f7f7f; }

svg.keymap {
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  background-color: #1e1e2e;
}
rect.key {
  fill: #313244;
  stroke: #45475a;
  stroke-width: 1.25;
}
rect.key.trans {
  fill: #1e1e2e;
  stroke: #313244;
  stroke-dasharray: 3 3;
}
text.tap { fill: #cdd6f4; font-size: 15px; font-weight: 600; }
text.hold { fill: #a6adc8; font-size: 10px; }
text.tl { fill: #cdd6f4; font-size: 12px; font-weight: 600; }
text.tr, use.tr { fill: #cba6f7; font-size: 11px; }
text.br, use.br, text.bl, use.bl { fill: #fab387; font-size: 11px; }
text.layer-activator { text-decoration: none; fill: #89b4fa; font-size: 10px; font-weight: 600; }

/* Tap/hold preference boxes (drawn behind center legend) */
rect.mod-box {
  rx: 3;
  ry: 3;
  stroke-width: 1.35;
}
/* Empty outline = tap-preferred */
rect.mod-box.tap-preferred {
  fill: none;
  stroke: #cdd6f4;
}
text.tap.tap-preferred {
  fill: #cdd6f4;
  font-size: 10px;
  font-weight: 600;
}
/* Solid fill = hold-preferred */
rect.mod-box.hold-preferred {
  fill: #a6adc8;
  stroke: #a6adc8;
}
text.tap.hold-preferred {
  fill: #1e1e2e;
  font-size: 10px;
  font-weight: 700;
}
/* Larger solid = sticky tap-hold */
rect.mod-box.sticky {
  fill: #cdd6f4;
  stroke: #cdd6f4;
  stroke-width: 1.5;
}
text.tap.sticky {
  fill: #1e1e2e;
  font-size: 11px;
  font-weight: 700;
}

/* Thumb layer activator fills */
rect.key.thumb-raise { fill: #3f2e1e; stroke: #fab387; }
rect.key.thumb-lower { fill: #1e2a3f; stroke: #89b4fa; }
rect.key.thumb-hyper { fill: #3f1e2a; stroke: #f38ba8; }
rect.key.thumb-mouse { fill: #1e3f28; stroke: #a6e3a1; }
rect.key.thumb-adjust { fill: #2a1e3f; stroke: #cba6f7; }
</style>
