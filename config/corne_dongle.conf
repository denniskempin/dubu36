# The halves sleep; the dongle is USB-powered and should stay awake.
CONFIG_ZMK_SLEEP=n

# Fixed full brightness; no ambient light sensor.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=100
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# The status screen is not set here: each dongle build picks one on the command
# line, so all four are built. See build.yaml and the Makefile.
