# The halves sleep; the dongle is USB-powered and should stay awake.
CONFIG_ZMK_SLEEP=n

# The module's Kconfig.defconfig asks for 4096, but ZMK's own default of 2048
# is evaluated first and wins unless this is set here. The Prospector UI needs
# the larger stack.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# APDS9960 is fitted. Set to n and uncomment FIXED_BRIGHTNESS if building
# without the sensor.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
