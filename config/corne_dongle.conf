# The halves sleep; the dongle is USB-powered and should stay awake.
CONFIG_ZMK_SLEEP=n

# Fixed full brightness; no ambient light sensor.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=100
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Classic is the default status screen. The others are RADII, FIELD and
# OPERATOR; see the module's README for what each one shows.
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
