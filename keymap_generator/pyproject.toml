[project]
name = "keymap-generator"
version = "0.1.0"
description = "Generate QMK and ZMK keymaps from a shared text grid."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
generate-keymap = "keymap_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.74",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keymap_generator"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include = ["src", "tests"]
